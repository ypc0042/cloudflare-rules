name = "cloudflare-rules"
# Cloudflare Worker 名称规则：仅 a-z、0-9、连字符 -；禁止下划线 _、禁止以 - 开头/结尾。
# 不要写成 cloudflare_rules。Vite 构建环境名由 vite.config.ts 的 viteEnvironment.name 单独控制。
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# 升级部署时保留 Dashboard 中维护的变量（Secrets 仍用 wrangler secret / Dashboard）。
keep_vars = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
# 动态路由先走 Worker，再回退静态资源。
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cloudflare-rules-db"
# database_id 首次部署后由 Dashboard / Builds 写入；本地可不填。
